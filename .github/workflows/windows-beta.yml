name: Windows Beta MSI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  windows-beta:
    name: Build Windows beta MSI
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend TypeScript
        run: npm run check

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -j 1

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml -j 1

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Backend format check
        run: python -m ruff format --check backend

      - name: Backend lint
        run: python -m ruff check backend

      - name: Backend tests
        run: python -m pytest backend/tests

      - name: Build Windows MSI
        run: npm run tauri:build

      - name: Discover MSI and checksum
        id: msi
        shell: pwsh
        run: |
          $msis = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Recurse -Filter "SpacePilot_*.msi" | Where-Object { $_.Name -notlike "*.previous.msi" }
          if ($msis.Count -ne 1) {
            Write-Error "Expected exactly one SpacePilot MSI, found $($msis.Count)."
            $msis | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          $msi = $msis[0]
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $msi.FullName).Hash.ToLowerInvariant()
          "$hash  $($msi.Name)" | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          $size = $msi.Length
          $mib = [math]::Round($size / 1MB, 2)
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($msi.Name)" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT
          "mib=$mib" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload Windows beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: spacepilot-windows-beta
          path: |
            ${{ steps.msi.outputs.path }}
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          @"
          # SpacePilot Windows Beta Build

          Git commit: $env:GITHUB_SHA
          Version: $version

          Frontend validation: PASS
          Rust validation: PASS
          Backend validation: PASS

          MSI: ${{ steps.msi.outputs.name }}
          Size: ${{ steps.msi.outputs.size }} bytes / ${{ steps.msi.outputs.mib }} MiB
          SHA-256: ${{ steps.msi.outputs.sha256 }}

          Signing: UNSIGNED BETA
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
